services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yetgil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-yetgil}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yetgil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 컨테이너 네트워크 안에서는 postgres/redis가 서비스명으로 통신되므로
      # .env의 localhost 기준 값을 여기서 덮어쓴다.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yetgil}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-yetgil}
      REDIS_URL: redis://redis:6379/0
      COMMUNITY_UPLOAD_DIR: /backend/uploads/community
    volumes:
      - community_uploads:/backend/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  community_uploads:
