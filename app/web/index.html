<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="yetgil_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>yetgil_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Flutter가 첫 프레임을 그리기 전까지(특히 초회 로드 시 몇 초) 빈 흰 화면이
    보이던 걸 막는 정적 로딩 화면 — 앱 배경색(#F2EFEA) 위에 실제 로고
    이미지(assets/logo/logo_icon.png, logo_wordmark.png)를 미리 보여준다.
    Flutter가 asset을 "assets/<원본 경로>"로 번들링하므로 여기서도 같은
    경로로 참조한다. #app-loading은 Flutter가 뜨면 그 위로 덮인다.
  -->
  <style>
    html, body { background: #F2EFEA; }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #F2EFEA;
    }
    #app-loading .badge { width: 72px; height: 72px; border-radius: 17px; }
    #app-loading .wordmark { height: 26px; }
  </style>
</head>
<body>
  <div id="app-loading">
    <img class="badge" src="assets/assets/logo/logo_icon.png" alt="">
    <img class="wordmark" src="assets/assets/logo/logo_wordmark.png" alt="옛길">
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
